pumasi:
  defaults:
    command: "codex exec --model gpt-5.6-sol --dangerously-bypass-approvals-and-sandbox"
    emoji: "🌾"

  tasks:
    - name: t1-fetch
      instruction: |
        작업 디렉토리: /Volumes/data/Dev/nongyak-kb (이하 모든 경로는 이 기준의 절대경로)

        먼저 반드시 읽을 것:
        - /Volumes/data/Dev/nongyak-kb/contracts/api-spec.md (API 명세·엔벨로프·에러코드)
        - /Volumes/data/Dev/nongyak-kb/contracts/interfaces.md (파일 레이아웃·manifest 형식)

        구현 파일: src/fetch.ts, tests/fetch.test.ts

        ## 시그니처
        ```typescript
        export type ServiceCode = 'SVC01' | 'SVC02' | 'SVC07' | 'SVC08'
        export async function fetchAll(opts: { services?: ServiceCode[]; mock?: boolean; rawDir?: string }): Promise<void>
        export function parseEnvelope(xml: string): { totalCount?: number; errorCode?: string; errorMsg?: string; items: Record<string, string>[] }
        ```
        CLI 엔트리(import.meta.main): `bun run src/fetch.ts [--service SVC01] [--mock]`

        ## 요구사항
        - XML 파싱: fast-xml-parser 사용 (필수 import: import { XMLParser } from 'fast-xml-parser'). 정규식 파싱 금지
        - api-spec.md의 서비스별 URL·파라미터 정확히 사용 (SVC08/SVC07은 엔드포인트가 다름에 주의)
        - 전량 수집: displayCount=50, startPoint 1..ceil(totalCount/50), 응답 원문을 data/raw/<SVC>/page-XXXX.xml로 그대로 저장
        - SVC02: SVC01 raw 완료 후 고유 pestiCode당 1회 (첫 diseaseUseSeq 사용) → data/raw/SVC02/<pestiCode>.xml
        - 레이트리밋 최대 4 req/s, ERR_901·HTTP 5xx·네트워크 오류는 지수 백오프 재시도 최대 5회, ERR_101/102/103/104/201은 즉시 throw
        - data/raw/manifest.json에 interfaces.md 형식으로 진행 상태 기록, 재실행 시 fetchedPages 건너뛰기(재개)
        - API 키: process.env.PSIS_API_KEY (없고 --mock도 아니면 명확한 에러 메시지로 종료)
        - --mock: 네트워크 없이 fixtures/ 전체를 data/raw/로 복사하고 manifest를 done으로 기록
        - 테스트: 네트워크·data/ 접근 금지. parseEnvelope는 fixtures XML로, fetchAll mock 모드는 mktemp 임시 rawDir로 검증

        ## 금지사항
        - 위 2개 외 파일 생성 금지, contracts/·fixtures/ 수정 금지
        - node-fetch/axios 등 HTTP 라이브러리 금지 (내장 fetch 사용)

        ## 완료 보고: 생성 파일, 구현 방식 요약, 설계 결정
      gates:
        - name: "파일 존재"
          command: "[ -f /Volumes/data/Dev/nongyak-kb/src/fetch.ts ] && [ -f /Volumes/data/Dev/nongyak-kb/tests/fetch.test.ts ]"
        - name: "타입 체크"
          command: "cd /Volumes/data/Dev/nongyak-kb && bunx tsc --noEmit"
        - name: "테스트"
          command: "cd /Volumes/data/Dev/nongyak-kb && bun test tests/fetch.test.ts"
        - name: "mock 배치 동작"
          command: "cd /Volumes/data/Dev/nongyak-kb && bun run src/fetch.ts --mock && [ -f data/raw/SVC01/page-0001.xml ] && [ -f data/raw/manifest.json ]"
        - name: "fast-xml-parser 사용"
          command: "grep -q 'fast-xml-parser' /Volumes/data/Dev/nongyak-kb/src/fetch.ts"

    - name: t2-normalize
      instruction: |
        작업 디렉토리: /Volumes/data/Dev/nongyak-kb (이하 절대경로)

        먼저 반드시 읽을 것:
        - /Volumes/data/Dev/nongyak-kb/contracts/schema.sql (DB 계약 — 그대로 적용, 수정 금지)
        - /Volumes/data/Dev/nongyak-kb/contracts/api-spec.md (raw XML 필드)
        - /Volumes/data/Dev/nongyak-kb/contracts/interfaces.md (raw 파일 레이아웃)
        - /Volumes/data/Dev/nongyak-kb/fixtures/ (샘플 XML)

        구현 파일: src/normalize.ts, tests/normalize.test.ts

        ## 시그니처
        ```typescript
        export interface NormalizeReport { counts: Record<string, number>; duplicateUsageKeys: number; cropCdConflicts: number }
        export function normalize(opts?: { rawDir?: string; dbPath?: string }): NormalizeReport
        ```
        CLI 엔트리(import.meta.main): `bun run src/normalize.ts` (기본 data/raw → data/kb.sqlite)

        ## 요구사항
        - DB: bun:sqlite (필수 import: import { Database } from 'bun:sqlite'). better-sqlite3 등 외부 드라이버 금지
        - 스키마: contracts/schema.sql 파일을 읽어 그대로 실행 (DDL 재작성 금지). 실행 전 기존 dbPath 파일 삭제(전체 재빌드, 멱등)
        - XML 파싱: fast-xml-parser
        - raw_* 테이블 적재 후 정규화: products(SVC01 첫 등장 행 + SVC02로 독성·함량 보강), crops, pests, usage_rules, revoked_products, analysis_methods
        - ingredient_name: eng_name에서 성분명만 best-effort 추출 (예: "kasugamycin SL2.3 %" → "kasugamycin", "glyphosate-isopropylammonium SL41 %" → "glyphosate-isopropylammonium"). 패턴 미매치 시 eng_name 전체를 사용
        - (pesti_code, disease_use_seq) 중복 발견 시 첫 행 유지, duplicateUsageKeys 카운트. crop_cd 이름 충돌도 first-wins + cropCdConflicts 카운트
        - fts_usage: 적재 완료 후 v_usage 기준으로 재빌드
        - CLI 실행 시 NormalizeReport를 사람이 읽을 수 있게 stdout 출력
        - 테스트: data/ 접근 금지. fixtures/를 mktemp 임시 rawDir에 interfaces.md 레이아웃으로 복사해 사용, 임시 dbPath. 테이블별 건수 어서션 (fixtures 기준: raw_svc01 5, products 4, crops 5, usage_rules 5, revoked 2, analysis 2)

        ## 금지사항
        - 위 2개 외 파일 생성 금지, contracts/·fixtures/ 수정 금지
      gates:
        - name: "파일 존재"
          command: "[ -f /Volumes/data/Dev/nongyak-kb/src/normalize.ts ] && [ -f /Volumes/data/Dev/nongyak-kb/tests/normalize.test.ts ]"
        - name: "타입 체크"
          command: "cd /Volumes/data/Dev/nongyak-kb && bunx tsc --noEmit"
        - name: "테스트"
          command: "cd /Volumes/data/Dev/nongyak-kb && bun test tests/normalize.test.ts"
        - name: "bun:sqlite 사용 + 스키마 파일 사용"
          command: "grep -q 'bun:sqlite' /Volumes/data/Dev/nongyak-kb/src/normalize.ts && grep -q 'schema.sql' /Volumes/data/Dev/nongyak-kb/src/normalize.ts"

    - name: t3-ontology
      instruction: |
        작업 디렉토리: /Volumes/data/Dev/nongyak-kb (이하 절대경로)

        먼저 반드시 읽을 것:
        - /Volumes/data/Dev/nongyak-kb/contracts/interfaces.md ("TTL 어휘" 절 — 어휘 계약)
        - /Volumes/data/Dev/nongyak-kb/contracts/schema.sql (읽을 테이블·뷰)

        구현 파일: src/export-ttl.ts, scripts/validate-shacl.py, tests/ttl.test.ts

        ## 시그니처
        ```typescript
        export function exportTtl(opts?: { dbPath?: string; outDir?: string }): { ontologyPath: string; shapesPath: string }
        ```
        CLI 엔트리(import.meta.main): `bun run src/export-ttl.ts` (기본 data/kb.sqlite → dist/)

        ## 요구사항
        - DB 읽기: bun:sqlite. 정규화 테이블·v_usage만 사용 (raw_* 금지)
        - TTL 직렬화: n3 라이브러리 Writer 필수 (필수 import: import { Writer, DataFactory } from 'n3'). 문자열 연결로 TTL 생성 금지
        - interfaces.md 어휘 그대로: 클래스 선언(rdfs:Class or owl:Class + rdfs:label), 인스턴스 IRI는 nykd:product-973, nykd:crop-1000, nykd:pest-<slug>, nykd:usage-973-1 형식 (slug: 한글 유지, 공백·괄호는 - 치환 후 percent-encoding은 N3에 위임)
        - UsageRule 재화 포함 전 관계: hasProduct/hasCrop/hasPest/dilution/applicationTiming/preHarvestInterval/maxApplications
        - shapes.ttl: 클래스별 sh:NodeShape (Product는 rdfs:label 필수, UsageRule은 hasProduct 필수 + hasCrop/hasPest 최소 1개 — sh:or 사용)
        - scripts/validate-shacl.py: pyshacl 사용, 인자 (data.ttl, shapes.ttl), 적합 시 exit 0 + "Conforms", 위반 시 exit 1 + 리포트 출력. pyshacl 미설치 시 exit 2 + 설치 안내
        - 테스트: mktemp 임시 sqlite를 contracts/schema.sql로 생성하고 fixtures 값 기반 소량 INSERT 후 exportTtl 실행 → TTL에 nyk:Product·nyk:UsageRule·한글 라벨 존재, shapes.ttl 생성 어서션. n3 Parser로 재파싱해 트리플 수 > 0 확인

        ## 금지사항
        - 위 3개 외 파일 생성 금지, contracts/·fixtures/ 수정 금지
      gates:
        - name: "파일 존재"
          command: "[ -f /Volumes/data/Dev/nongyak-kb/src/export-ttl.ts ] && [ -f /Volumes/data/Dev/nongyak-kb/scripts/validate-shacl.py ] && [ -f /Volumes/data/Dev/nongyak-kb/tests/ttl.test.ts ]"
        - name: "타입 체크"
          command: "cd /Volumes/data/Dev/nongyak-kb && bunx tsc --noEmit"
        - name: "테스트"
          command: "cd /Volumes/data/Dev/nongyak-kb && bun test tests/ttl.test.ts"
        - name: "n3 사용"
          command: "grep -q \"from 'n3'\" /Volumes/data/Dev/nongyak-kb/src/export-ttl.ts"

    - name: t4-graph-cli
      instruction: |
        작업 디렉토리: /Volumes/data/Dev/nongyak-kb (이하 절대경로)

        먼저 반드시 읽을 것:
        - /Volumes/data/Dev/nongyak-kb/contracts/interfaces.md ("CLI 명세"·"graph.json" 절 — 출력 계약)
        - /Volumes/data/Dev/nongyak-kb/contracts/schema.sql

        구현 파일: src/export-graph.ts, src/cli.ts, tests/cli.test.ts

        ## 시그니처
        ```typescript
        // export-graph.ts
        export function exportGraph(opts?: { dbPath?: string; outPath?: string }): string  // 생성된 graph.json 경로 반환
        // cli.ts — 서브커맨드: query <검색어> [--json] [--limit N] | product <이름> | stats
        export function runCli(argv: string[], dbPath?: string): Promise<number>  // exit code
        ```
        CLI 엔트리(import.meta.main): `bun run src/cli.ts <cmd>` (기본 DB: data/kb.sqlite)

        ## 요구사항
        - DB: bun:sqlite, 정규화 테이블·v_usage·fts_usage만 사용 (raw_* 금지)
        - graph.json: interfaces.md의 노드/엣지 형식·id 체계·type 문자열 그대로. 중복 노드 없이 (Map으로 dedupe), 등록취소 제품은 product 노드 props.revoked=true
        - kb query: fts_usage MATCH (검색어는 이중따옴표로 감싸 phrase-safe 처리), 기본 limit 20, TSV 헤더는 interfaces.md 명세 그대로, --json은 v_usage 행 배열
        - kb product: 품목명 또는 상표명 정확·부분 일치로 제품 찾고 상세 + 소속 usage_rules 전부 + revoked_products 매치 시 "등록취소" 표시
        - kb stats: 테이블별 건수 + kb.sqlite 파일 mtime
        - 결과 없음은 exit 0 + 빈 출력, DB 파일 없음·잘못된 커맨드는 exit 1 + stderr 안내
        - 테스트: mktemp 임시 sqlite를 contracts/schema.sql로 생성, fixtures 값 기반 소량 INSERT(fts_usage 포함) 후: query "탄저병" 결과 ≥1, --json 파싱 가능, exportGraph 산출 JSON에 product·crop·pest 노드와 applies_to 엣지 존재 어서션

        ## 금지사항
        - 위 3개 외 파일 생성 금지, contracts/·fixtures/ 수정 금지, 외부 CLI 프레임워크(commander 등) 금지 — 수동 argv 파싱
      gates:
        - name: "파일 존재"
          command: "[ -f /Volumes/data/Dev/nongyak-kb/src/export-graph.ts ] && [ -f /Volumes/data/Dev/nongyak-kb/src/cli.ts ] && [ -f /Volumes/data/Dev/nongyak-kb/tests/cli.test.ts ]"
        - name: "타입 체크"
          command: "cd /Volumes/data/Dev/nongyak-kb && bunx tsc --noEmit"
        - name: "테스트"
          command: "cd /Volumes/data/Dev/nongyak-kb && bun test tests/cli.test.ts"
        - name: "fts 사용"
          command: "grep -q 'fts_usage' /Volumes/data/Dev/nongyak-kb/src/cli.ts"

    - name: t5-webapp
      instruction: |
        작업 디렉토리: /Volumes/data/Dev/nongyak-kb (이하 절대경로)

        먼저 반드시 읽을 것:
        - /Volumes/data/Dev/nongyak-kb/contracts/interfaces.md ("웹앱 계약" 절)
        - /Volumes/data/Dev/nongyak-kb/contracts/schema.sql (v_usage 뷰 필드)

        구현 파일: web/index.html, web/app.js, web/theme.css, web/vendor/sql-wasm.js, web/vendor/sql-wasm.wasm

        ## 요구사항
        - 정적 파일만: 프레임워크·빌드도구·CDN 참조 절대 금지. sql.js는 공식 릴리스(v1.13.0)에서 sql-wasm.js/sql-wasm.wasm을 web/vendor/에 다운로드(vendored)
        - app.js: fetch('../data/kb.sqlite') → initSqlJs({ locateFile: vendor 경로 }) → DB 로드. 파일 없으면 화면에 "데이터 없음 — bun run fetch/normalize 안내" 표시
        - UI: 상단 통합 검색창(작물/병해충/품목/상표/회사) + 용도 필터 칩(전체/살균제/살충제/제초제/기타) + 결과 테이블 (컬럼: 품목명, 상표명, 회사, 작물, 병해충, 희석배수, 사용적기, 안전사용기준(시기·횟수)) + 결과 건수 표시. 검색은 v_usage에 대한 LIKE 조합 쿼리 (fts_usage는 sql.js에서 unicode61 미지원 가능성 있으므로 사용 금지), debounce 250ms, 결과 최대 200행
        - 테마: DEXA 다크 — Ink 계열 어두운 배경 + 시안 액센트, 하드웨어 패널 모티프(각진 패널, 미세한 보더, 모노스페이스 수치). 모든 색·간격·폰트 토큰은 theme.css :root CSS 변수로만 정의하고 다른 곳에 hex 직접 사용 금지
        - 한국어 UI, 반응형(모바일 1컬럼)
        - 자체 검증: python3 -m http.server로 web/ 서빙해 콘솔 에러 없음 확인하고 보고 (샘플 kb.sqlite가 없으면 "데이터 없음" 경로 확인)

        ## 금지사항
        - 위 5개 외 파일 생성 금지 (web/ 밖 수정 절대 금지), contracts/·fixtures/·src/ 수정 금지
      gates:
        - name: "파일 존재"
          command: "[ -f /Volumes/data/Dev/nongyak-kb/web/index.html ] && [ -f /Volumes/data/Dev/nongyak-kb/web/app.js ] && [ -f /Volumes/data/Dev/nongyak-kb/web/theme.css ] && [ -f /Volumes/data/Dev/nongyak-kb/web/vendor/sql-wasm.js ] && [ -f /Volumes/data/Dev/nongyak-kb/web/vendor/sql-wasm.wasm ]"
        - name: "CDN 미사용"
          command: "! grep -rEq 'https?://(cdn|unpkg|jsdelivr)' /Volumes/data/Dev/nongyak-kb/web/index.html /Volumes/data/Dev/nongyak-kb/web/app.js"
        - name: "토큰 중앙화"
          command: "grep -q ':root' /Volumes/data/Dev/nongyak-kb/web/theme.css && ! grep -Eq '#[0-9a-fA-F]{3,8}' /Volumes/data/Dev/nongyak-kb/web/app.js"
        - name: "sql.js 연동"
          command: "grep -q 'initSqlJs' /Volumes/data/Dev/nongyak-kb/web/app.js && grep -q 'v_usage' /Volumes/data/Dev/nongyak-kb/web/app.js"

  settings:
    timeout: 3600
